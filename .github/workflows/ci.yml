name: Relay Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend CI (Node 22 + TypeScript + Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Linting & Formatting (Biome)
        run: npm run lint

      - name: Run Backend Tests
        run: npm test
        env:
          PORT: 4000
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/relay_task_db?schema=public"
          JWT_SECRET: "relay-test-secret-ci-key-2026-safe"
          JWT_EXPIRES_IN: "7d"
          CORS_ORIGIN: "http://localhost:3000"

  frontend-ci:
    name: Frontend CI (Next.js 16 + React 19 + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (Strict TypeScript)
        run: npx tsc --noEmit

      - name: Check Linting (Biome)
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_BE_URL: "http://localhost:4000"

